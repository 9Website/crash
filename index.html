<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 Million Particles Maximum WebGL Limit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #f3f4f6;
            overflow: hidden;
            margin: 0;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 50px rgba(168, 85, 247, 0.8); }
        }
        .glow-btn {
            animation: pulse-glow 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">

    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <div id="ui-overlay" class="relative z-10 flex flex-col items-center justify-center p-8 max-w-md w-full glass-panel rounded-3xl shadow-2xl transition-all duration-700">
        <div class="mb-6 text-center">
            <span class="px-3 py-1 text-xs font-semibold uppercase tracking-widest bg-red-500/10 text-red-400 rounded-full border border-red-500/20">
                Hardware Absolute Limit
            </span>
            <h1 class="text-3xl font-extrabold mt-4 tracking-tight bg-gradient-to-r from-red-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent">
                200M Particle Core
            </h1>
            <p class="text-sm text-gray-400 mt-2">
                Reaching the absolute threshold of browser VRAM allocation (200,000,000 particles). 1 Billion exceeds browser memory boundaries.
            </p>
        </div>

        <button id="load-btn" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-red-600 via-purple-600 to-indigo-600 hover:from-red-500 hover:to-indigo-500 text-white font-semibold shadow-lg glow-btn transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer flex items-center justify-center space-x-2">
            <span>Initialize 200 Million Particles</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </button>

        <div id="loading-container" class="hidden w-full flex flex-col items-center space-y-4 py-4">
            <div class="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-red-500 to-purple-500 h-2.5 rounded-full w-0 transition-all duration-300"></div>
            </div>
            <p id="loading-status" class="text-xs font-medium text-gray-400 tracking-wider uppercase animate-pulse">Allocating Maximum VRAM...</p>
        </div>
    </div>

    <div id="hud" class="hidden absolute top-6 left-6 z-10 glass-panel px-5 py-3 rounded-2xl flex items-center space-x-4 shadow-lg">
        <div>
            <div class="text-[10px] uppercase tracking-widest text-gray-400">Particles</div>
            <div class="text-sm font-bold text-red-400">200,000,000</div>
        </div>
        <div class="h-8 w-px bg-white/10"></div>
        <div>
            <div class="text-[10px] uppercase tracking-widest text-gray-400">FPS</div>
            <div id="fps-counter" class="text-sm font-bold text-emerald-400">60</div>
        </div>
    </div>

    <script>
        const vertexShader = `
            uniform float uTime;
            uniform float uTransition;
            attribute vec3 aTargetPosition;
            attribute vec3 aRandoms;
            varying vec3 vColor;
            varying float vAlpha;

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            vec3 curlNoise(vec3 p) {
                float e = 0.1;
                vec3 dx = vec3(e, 0.0, 0.0);
                vec3 dy = vec3(0.0, e, 0.0);
                vec3 dz = vec3(0.0, 0.0, e);

                vec3 p_x0 = snoise(p - dx) * vec3(1.0);
                vec3 p_x1 = snoise(p + dx) * vec3(1.0);
                vec3 p_y0 = snoise(p - dy) * vec3(1.0);
                vec3 p_y1 = snoise(p + dy) * vec3(1.0);
                vec3 p_z0 = snoise(p - dz) * vec3(1.0);
                vec3 p_z1 = snoise(p + dz) * vec3(1.0);

                float x = p_y1.z - p_y0.z - p_z1.y + p_z0.y;
                float y = p_z1.x - p_z0.x - p_x1.z + p_x0.z;
                float z = p_x1.y - p_x0.y - p_y1.x + p_y0.x;

                return normalize(vec3(x, y, z));
            }

            void main() {
                vec3 pos = position;
                vec3 target = aTargetPosition;
                
                vec3 mixedPos = mix(pos, target, uTransition);
                vec3 flow = curlNoise(mixedPos * 0.15 + vec3(0.0, uTime * 0.2, 0.0)) * 1.5;
                mixedPos += flow * (1.0 - uTransition * 0.5);

                vec4 mvPosition = modelViewMatrix * vec4(mixedPos, 1.0);
                gl_Position = projectionMatrix * mvPosition;

                gl_PointSize = (6.5 * (2.0 + aRandoms.x)) / (-mvPosition.z);

                float dist = length(mixedPos) / 40.0;
                vColor = mix(vec3(1.0, 0.2, 0.4), vec3(0.4, 0.2, 1.0), clamp(dist, 0.0, 1.0));
                vColor += aRandoms * 0.2;
                vAlpha = clamp(1.0 - dist * 0.5, 0.2, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            varying float vAlpha;

            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;

                float glow = smoothstep(0.5, 0.0, dist);
                gl_FragColor = vec4(vColor, glow * vAlpha * 0.85);
            }
        `;

        let scene, camera, renderer, particleSystem, particleGeometry, particleMaterial;
        let animationFrameId = null;
        let isRunning = false;
        let clock = new THREE.Clock();
        let targetTransition = 0.0;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        const loadBtn = document.getElementById('load-btn');
        const uiOverlay = document.getElementById('ui-overlay');
        const loadingContainer = document.getElementById('loading-container');
        const progressBar = document.getElementById('progress-bar');
        const loadingStatus = document.getElementById('loading-status');
        const hud = document.getElementById('hud');
        const fpsCounter = document.getElementById('fps-counter');

        function initScene() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 55;

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('touchmove', onTouchMove, { passive: true });
        }

        function generateParticles() {
            // 200 Million particles limit (~7.2 GB VRAM allocation boundary)
            const count = 200000000;
            
            particleGeometry = new THREE.BufferGeometry();
            
            const positions = new Float32Array(count * 3);
            const targetPositions = new Float32Array(count * 3);
            const randoms = new Float32Array(count * 3);

            const radius = 25.0;
            for (let i = 0; i < count; i++) {
                const i3 = i * 3;

                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = Math.cbrt(Math.random()) * radius * 1.5;

                positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = r * Math.cos(phi);

                const tU = Math.random() * Math.PI * 2.0;
                const tV = Math.random() * Math.PI * 2.0;
                const majorR = 18.0;
                const minorR = 6.0 * (Math.random() * 0.8 + 0.2);

                targetPositions[i3] = (majorR + minorR * Math.cos(tV)) * Math.cos(tU);
                targetPositions[i3 + 1] = (majorR + minorR * Math.cos(tV)) * Math.sin(tU);
                targetPositions[i3 + 2] = minorR * Math.sin(tV) + (Math.random() - 0.5) * 8.0;

                randoms[i3] = Math.random();
                randoms[i3 + 1] = Math.random();
                randoms[i3 + 2] = Math.random();
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('aTargetPosition', new THREE.BufferAttribute(targetPositions, 3));
            particleGeometry.setAttribute('aRandoms', new THREE.BufferAttribute(randoms, 3));

            particleMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uTime: { value: 0.0 },
                    uTransition: { value: 0.0 }
                },
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
        }

        loadBtn.addEventListener('click', () => {
            loadBtn.classList.add('hidden');
            loadingContainer.classList.remove('hidden');

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 6) + 3;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    loadingStatus.textContent = "Injecting 200M Buffers into GPU VRAM...";
                    
                    setTimeout(() => {
                        if (!particleSystem) {
                            generateParticles();
                        }
                        uiOverlay.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                        setTimeout(() => {
                            uiOverlay.classList.add('hidden');
                            hud.classList.remove('hidden');
                            isRunning = true;
                            clock.start();
                            animate();
                        }, 500);
                    }, 800);
                }
                progressBar.style.width = progress + '%';
                if (progress > 60) loadingStatus.textContent = "Allocating 7.2GB+ Raw GPU Arrays...";
                else if (progress > 30) loadingStatus.textContent = "Compiling Heavy Vector Flow Shaders...";
            }, 250);
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            mouseY = (event.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                mouseY = (event.touches[0].clientY - window.innerHeight / 2) / (window.innerHeight / 2);
            }
        }

        let lastTime = performance.now();
        let frameCount = 0;

        function animate() {
            if (!isRunning) return;
            animationFrameId = requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            
            if (targetTransition < 1.0) {
                targetTransition += 0.004;
                if (targetTransition > 1.0) targetTransition = 1.0;
                particleMaterial.uniforms.uTransition.value = targetTransition;
            }

            particleMaterial.uniforms.uTime.value = elapsedTime;

            targetRotationX += (mouseY * 0.5 - targetRotationX) * 0.05;
            targetRotationY += (mouseX * 0.5 - targetRotationY) * 0.05;

            particleSystem.rotation.x = targetRotationX + elapsedTime * 0.025;
            particleSystem.rotation.y = targetRotationY + elapsedTime * 0.04;

            renderer.render(scene, camera);

            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fpsCounter.textContent = Math.round((frameCount * 1000) / (currentTime - lastTime));
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        window.onload = function() {
            initScene();
        };
    </script>
</body>
</html>
